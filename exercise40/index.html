<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise40</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player-card">
        <div class="video-window">
            <video id="main-video" poster="thumbnail.jpg">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>

        <div class="song-info">
            <h2 id="title">Sample Video</h2>
            <p id="artist">Production Studio</p>
        </div>

        <div class="progress-area">
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <div class="timestamps">
                <span id="current-time">0:00</span>
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <div class="main-controls">
            <button id="prev"><i class="fas fa-step-backward"></i></button>
            <button id="play-pause" class="play-btn"><i class="fas fa-play"></i></button>
            <button id="next"><i class="fas fa-step-forward"></i></button>
        </div>

        <div class="bottom-controls">
            <div class="volume-box">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8">
            </div>
            <select id="speed-select">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
            </select>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
